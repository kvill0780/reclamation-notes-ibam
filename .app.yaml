name: reclamation-notes-ibam
services:
  # Backend Spring Boot
  - name: api-backend
    github:
      repo: kvill0780/reclamation-notes-ibam
      branch: main
      deploy_on_push: true
    build_command: cd reclamation && mvn clean package -DskipTests -Pprod
    run_command: java -jar reclamation/target/reclamation-0.0.1-SNAPSHOT.jar
    source_dir: reclamation
    envs:
      - key: SPRING_DATASOURCE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.connection_string}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        scope: RUN_AND_BUILD_TIME
        value: ${db.username}
      - key: SPRING_DATASOURCE_PASSWORD
        scope: RUN_AND_BUILD_TIME
        value: ${db.password}
      - key: JWT_SECRET
        scope: RUN_TIME
        value: ${JWT_SECRET}
      - key: SPRING_PROFILES_ACTIVE
        scope: RUN_TIME
        value: prod
    http_port: 8080
    health_check:
      http_path: /actuator/health
    cors_domains:
      - "https://reclamation-frontend.ondigitalocean.app"
    log_destinations:
      - name: api-logs
        source: stdout

  # Frontend React avec Vite
  - name: frontend
    github:
      repo: kvill0780/reclamation-notes-ibam
      branch: main
      deploy_on_push: true
    build_command: cd frontend && npm install && npm run build
    source_dir: frontend
    envs:
      - key: VITE_API_BASE_URL
        value: https://api-backend-xxxxxx.ondigitalocean.app/api
    http_port: 3000
    health_check:
      http_path: /

# Base de données PostgreSQL
databases:
  - name: reclamations-db
    engine: PG
    version: "14"
    production: true
