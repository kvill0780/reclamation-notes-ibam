version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: reclamations-db
    environment:
      POSTGRES_DB: reclamations_db
      POSTGRES_USER: ${DB_USER:-kvill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgre}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./reclamation/src/main/resources/data.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kvill}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: api-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reclamations_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-kvill}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgre}
      JWT_SECRET: ${JWT_SECRET:-IBAM_SUPER_SECRET_KEY_32_CHARS_MINIMUM_FOR_SECURITY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "3000:80"
    depends_on:
      - api-backend

volumes:
  postgres_data:
